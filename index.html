  <link rel="stylesheet" href="home.css">

<body>
  <a class="skip-link" href="#link-list">링크 목록으로 건너뛰기</a>

  <header class="home-hero">
    <div class="hero-content">
      <p class="hero-kicker">MY LITTLE LINK SPACE</p>
      <h1>habang222</h1>

      <a class="hero-jump" href="#links">링크 둘러보기 <span aria-hidden="true">↓</span></a>

  <main class="home-main" id="links">
    <div class="section-heading">
      <div>
        <p class="section-kicker">EXPLORE</p>
